version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    target-branch: "main"
    commit-message:
      prefix: "chore(deps):"
    groups:
      playwright:
        patterns:
          - "@playwright/*"
          - "playwright"
          - "playwright-core"
      cloudflare-worker-test-toolchain:
        patterns:
          - "@cloudflare/vitest-plugin"
          - "@cloudflare/workers-types"
          - "@vitest/*"
          - "vitest"
          - "wrangler"
      resizable-panels:
        patterns:
          - "react-resizable-panels"
      dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@playwright/*"
          - "playwright"
          - "playwright-core"
          - "@cloudflare/vitest-plugin"
          - "@cloudflare/workers-types"
          - "@vitest/*"
          - "vitest"
          - "wrangler"
          - "react-resizable-panels"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    target-branch: "main"
    commit-message:
      prefix: "chore(deps):"
    groups:
      dependencies:
        patterns:
          - "*"
