name: DB Query Check

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Scan production SQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @alook/agent-driver build
      - name: Compute DB Query Check input hash
        id: input-hash
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: echo "hash=$(node scripts/db-query-check/run.mjs --print-input-hash)" >> "$GITHUB_OUTPUT"
      - name: Restore DB Query Check cache
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci/db-query-check-cache
          key: db-query-check-v1-${{ runner.os }}-${{ steps.input-hash.outputs.hash }}
      - run: pnpm check:db-queries --require-complete
        env:
          ALOOK_DB_QUERY_CACHE_DIR: .ci/db-query-check-cache
          ALOOK_DB_QUERY_FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      - name: Preserve query plans and coverage gaps
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: db-query-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci/db-query-check/
          if-no-files-found: error
          retention-days: 14
