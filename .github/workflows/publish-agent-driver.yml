name: Publish Agent Driver

on:
  push:
    branches: [main]
    paths: [src/daemon/agent-driver/package.json]

concurrency:
  group: publish-agent-driver
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @alook/agent-driver to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect version
        id: version
        run: |
          VERSION=$(node -p "require('./src/daemon/agent-driver/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version already published
        id: check
        run: |
          if npm view "@alook/agent-driver@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@alook/agent-driver@${{ steps.version.outputs.version }} already on npm — skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: steps.check.outputs.skip == 'false'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.check.outputs.skip == 'false'
        with:
          bun-version: 1.3.11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.check.outputs.skip == 'false'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Upgrade npm for Trusted Publishers
        if: steps.check.outputs.skip == 'false'
        run: |
          npm install -g --prefix="$RUNNER_TEMP/npm-new" npm@latest
          echo "$RUNNER_TEMP/npm-new/bin" >> "$GITHUB_PATH"

      - run: pnpm install --frozen-lockfile
        if: steps.check.outputs.skip == 'false'

      - name: Build agent driver
        if: steps.check.outputs.skip == 'false'
        run: pnpm -C src/daemon/agent-driver run build

      - name: Publish to npm (OIDC)
        if: steps.check.outputs.skip == 'false'
        working-directory: src/daemon/agent-driver
        run: npm publish --access public
