        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.scope.outputs.plan_artifact_name }}
          path: .ci
      - name: Validate execution plan
        if: needs.scope.result == 'success'
        env:
          CI_EXECUTION_PLAN_FILE: .ci/execution-plan.json
          CI_PLAN_HASH: ${{ needs.scope.outputs.plan_hash }}
          CI_PROJECTION_NAME: run_lighthouse
          CI_PROJECTION_VALUE: ${{ needs.scope.outputs.run_lighthouse }}
        run: node scripts/ci/validate-execution-plan.mjs
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: printf 'BETTER_AUTH_SECRET=ci-lighthouse-secret\nBETTER_AUTH_URL=http://localhost:3000\n' > src/web/.dev.vars
      - run: pnpm run db:migrate
      - working-directory: src/web
        run: npx @lhci/cli autorun --config=lighthouserc.json && node scripts/print-lighthouse-scores.mjs

  ui-e2e-build:
    name: Web and Blog OpenNext artifacts
    needs: scope
    outputs:
      artifact_name: ${{ steps.artifact_identity.outputs.artifact_name }}
      artifact_attempt: ${{ steps.artifact_identity.outputs.artifact_attempt }}
    if: needs.scope.outputs.run_worker_build == 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.scope.outputs.worker_build_image }}
      options: --init --ipc=host --user 1001
    defaults:
      run:
        shell: bash
    env:
      NEXT_PUBLIC_WS_DO_PORT: "3000"
      WORKER_ZONES: ${{ needs.scope.outputs.worker_zones }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download execution plan
        if: needs.scope.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.scope.outputs.plan_artifact_name }}
          path: .ci
      - name: Validate execution plan
        if: needs.scope.result == 'success'
        env:
          CI_EXECUTION_PLAN_FILE: .ci/execution-plan.json
          CI_PLAN_HASH: ${{ needs.scope.outputs.plan_hash }}
          CI_PROJECTION_NAME: worker_zones
          CI_PROJECTION_VALUE: ${{ needs.scope.outputs.worker_zones }}
        run: node scripts/ci/validate-execution-plan.mjs
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.23.4"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record build artifact identity
        id: artifact_identity
        run: |
          printf 'artifact_name=ui-e2e-build-%s-%s\n' "${{ github.run_id }}" "${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          printf 'artifact_attempt=%s\n' "${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - run: node scripts/ci/write-ui-fixture-env.mjs
      - name: Build selected OpenNext workers once
        run: |
          mapfile -t zones < <(node -e 'for (const value of JSON.parse(process.env.WORKER_ZONES)) console.log(value)')
          tasks=(); for zone in "${zones[@]}"; do
            if [[ "$zone" == web ]]; then tasks+=("@alook/web#build"); else tasks+=("@alook/web#build:blog"); fi
          done
          node scripts/ci/run-turbo.mjs run "${tasks[@]}" --concurrency=1
          if [[ "$WORKER_ZONES" == '["web","blog"]' ]]; then pnpm --filter @alook/web verify:zone-output; fi
      - name: Create exact-head build artifact
        run: |
          zones=$(node -e 'console.log(JSON.parse(process.env.WORKER_ZONES).join(","))')
          node scripts/ci/e2e-build-artifact.mjs create \
            --directory .ci/ui-e2e-build \
            --run-id "${{ github.run_id }}" \
            --attempt "${{ steps.artifact_identity.outputs.artifact_attempt }}" \
            --head-sha "${{ github.sha }}" --zones "$zones"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.artifact_identity.outputs.artifact_name }}
          path: |
            .ci/ui-e2e-build/ui-e2e-build.tgz
            .ci/ui-e2e-build/ui-e2e-build-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  e2e-ui:
    name: UI Playwright E2E (${{ matrix.shard }}/${{ matrix.total }})
    needs: [scope, ui-e2e-build]
    if: needs.scope.outputs.run_ui_e2e == 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      options: --init --ipc=host --user 1001
    defaults:
      run:
        shell: bash
    timeout-minutes: ${{ contains(matrix.specs, 'src/test/e2e-ui/55-history-reading-continuity.spec.ts') && 45 || 20 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.e2e_matrix) }}
    env:
      NEXT_PUBLIC_WS_DO_PORT: "3000"
      WORKER_ZONES: ${{ needs.scope.outputs.worker_zones }}
      BETTER_AUTH_SECRET: ci-e2e-ui-secret
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download execution plan
        if: needs.scope.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.scope.outputs.plan_artifact_name }}
          path: .ci
      - name: Validate execution plan
        if: needs.scope.result == 'success'
        env:
          CI_EXECUTION_PLAN_FILE: .ci/execution-plan.json
          CI_PLAN_HASH: ${{ needs.scope.outputs.plan_hash }}
          CI_PROJECTION_NAME: e2e_matrix
          CI_PROJECTION_VALUE: ${{ needs.scope.outputs.e2e_matrix }}
        run: node scripts/ci/validate-execution-plan.mjs
      - env:
          E2E_SPECS: ${{ toJSON(matrix.specs) }}
          E2E_CASE_KEYS: ${{ toJSON(matrix.case_keys) }}
        run: |
          node scripts/ci/e2e-shard-artifacts.mjs write-manifest \
            --output src/web/e2e-shard-manifest/shard-manifest.json \
            --run-id "${{ github.run_id }}" \
            --attempt "${{ github.run_attempt }}" \
            --sha "${{ github.sha }}" \
            --shard "${{ matrix.shard }}" \
            --total "${{ matrix.total }}" \
            --native-shard "${{ matrix.native_shard }}" \
            --native-total "${{ matrix.native_total }}"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.23.4"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/ci/write-ui-fixture-env.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.ui-e2e-build.outputs.artifact_name }}
          path: .ci/ui-e2e-build
      - name: Verify exact-head build artifact
        run: |
          zones=$(node -e 'console.log(JSON.parse(process.env.WORKER_ZONES).join(","))')
          node scripts/ci/e2e-build-artifact.mjs verify \
            --directory .ci/ui-e2e-build \
            --run-id "${{ github.run_id }}" \
            --attempt "${{ needs.ui-e2e-build.outputs.artifact_attempt }}" \
            --head-sha "${{ github.sha }}" --zones "$zones"
      - name: Run native Playwright partition
        timeout-minutes: ${{ contains(matrix.specs, 'src/test/e2e-ui/55-history-reading-continuity.spec.ts') && 40 || 14 }}
        env:
          ALOOK_E2E_PREBUILT: "1"
          ALOOK_E2E_ZONES: ${{ toJSON(matrix.zones) }}
          E2E_SPECS: ${{ needs.scope.outputs.ui_specs }}
        run: |
          mapfile -t specs < <(node -e 'for (const spec of JSON.parse(process.env.E2E_SPECS)) if (spec !== "all") console.log("src/test/e2e-ui/" + spec)')
          pnpm --filter @alook/web exec playwright test "${specs[@]}" --shard=${{ matrix.native_shard }}/${{ matrix.native_total }}
      - name: Restore browser services
        if: ${{ always() }}
        run: pnpm --filter @alook/web exec tsx -e 'import teardown from "./src/test/e2e-ui/_setup/global-teardown.ts"; teardown().catch(error => { console.error(error); process.exitCode = 1 })'
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: blob-report-${{ github.run_id }}-${{ matrix.shard }}
          path: |
            src/web/blob-report/
            src/web/e2e-shard-manifest/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-artifacts-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: |
            src/web/test-results/
            src/web/e2e-service-logs/
          if-no-files-found: ignore
          retention-days: 7

  resizable-panels-compat:
    name: Resizable panels compatibility
    needs: [scope, ui-e2e-build]
    if: needs.scope.outputs.run_resizable_panels_compat == 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ fromJSON(needs.scope.outputs.e2e_matrix).include[0].image }}
      options: --init --ipc=host --user 1001
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_WS_DO_PORT: "3000"
      WORKER_ZONES: ${{ needs.scope.outputs.worker_zones }}
      BETTER_AUTH_SECRET: ci-e2e-ui-secret
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download execution plan
        if: needs.scope.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.scope.outputs.plan_artifact_name }}
          path: .ci
      - name: Validate execution plan
        if: needs.scope.result == 'success'
        env:
          CI_EXECUTION_PLAN_FILE: .ci/execution-plan.json
          CI_PLAN_HASH: ${{ needs.scope.outputs.plan_hash }}
          CI_PROJECTION_NAME: e2e_matrix
          CI_PROJECTION_VALUE: ${{ needs.scope.outputs.e2e_matrix }}
        run: node scripts/ci/validate-execution-plan.mjs
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.23.4"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/ci/write-ui-fixture-env.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.ui-e2e-build.outputs.artifact_name }}
          path: .ci/ui-e2e-build
      - name: Verify exact-head build artifact
        run: |
          zones=$(node -e 'console.log(JSON.parse(process.env.WORKER_ZONES).join(","))')
          node scripts/ci/e2e-build-artifact.mjs verify \
            --directory .ci/ui-e2e-build \
            --run-id "${{ github.run_id }}" \
            --attempt "${{ needs.ui-e2e-build.outputs.artifact_attempt }}" \
            --head-sha "${{ github.sha }}" --zones "$zones"
      - name: Run responsive shell compatibility journeys
        env:
          ALOOK_E2E_PREBUILT: "1"
          ALOOK_E2E_ZONES: '["web"]'
        run: |
          pnpm --filter @alook/web exec playwright test \
            src/test/e2e-ui/53-mobile-inbox-surface.spec.ts \
            src/test/e2e-ui/60-desktop-default-user-bar-width.spec.ts \
            --grep 'preserves Marked tab, scroll, and request ownership across 639↔640|restores fresh and saved mobile-first desktop entries before paint'
      - if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: resizable-panels-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            src/web/test-results/
            src/web/e2e-service-logs/
          if-no-files-found: ignore
          retention-days: 7

  merge-reports:
    name: Merge Playwright Reports
    needs: [scope, e2e-ui]
    if: ${{ !cancelled() && needs.scope.outputs.run_ui_e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download execution plan
        if: needs.scope.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.scope.outputs.plan_artifact_name }}
          path: .ci
      - name: Validate execution plan
        if: needs.scope.result == 'success'
        env:
          CI_EXECUTION_PLAN_FILE: .ci/execution-plan.json
          CI_PLAN_HASH: ${{ needs.scope.outputs.plan_hash }}
          CI_PROJECTION_NAME: e2e_matrix
          CI_PROJECTION_VALUE: ${{ needs.scope.outputs.e2e_matrix }}
        run: node scripts/ci/validate-execution-plan.mjs
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: blob-report-${{ github.run_id }}-*
          path: downloaded-blob-report-archives
          merge-multiple: false
          skip-decompress: true
          digest-mismatch: error
      - name: Extract report archives using central-directory metadata
        run: python3 scripts/ci/extract-report-artifacts.py --root downloaded-blob-report-archives --output downloaded-blob-reports
      - env:
          E2E_MATRIX: ${{ needs.scope.outputs.e2e_matrix }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/ci/e2e-shard-artifacts.mjs verify-artifacts \
            --root downloaded-blob-reports \
            --output verified-blob-reports \
            --run-id "${{ github.run_id }}" \
            --attempt "${{ github.run_attempt }}" \
            --sha "${{ github.sha }}"
      - env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ github.workspace }}/playwright-report
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/merged-report.json
        run: pnpm --filter @alook/web exec playwright merge-reports --reporter html,json "${{ github.workspace }}/verified-blob-reports"
      - env:
          E2E_MATRIX: ${{ needs.scope.outputs.e2e_matrix }}
        run: node scripts/ci/e2e-shard-artifacts.mjs verify-merged --report merged-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            merged-report.json
          if-no-files-found: error
          retention-days: 14

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - scope
      - auth-build
      - blog-build
      - static-checks
      - test-linux
      - test-windows
      - app-packed-artifact
      - e2e
      - desktop-rust
      - lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_GATE_RESULTS: >-
        [
          {"name":"scope","expected":true,"result":"${{ needs.scope.result }}"},
          {"name":"auth-build","expected":${{ needs.scope.outputs.run_auth_build == 'true' }},"result":"${{ needs.auth-build.result }}"},
          {"name":"blog-build","expected":${{ needs.scope.outputs.run_blog_build == 'true' }},"result":"${{ needs.blog-build.result }}"},
          {"name":"static-checks","expected":${{ needs.scope.outputs.run_static_checks == 'true' }},"result":"${{ needs.static-checks.result }}"},
          {"name":"test-linux","expected":${{ needs.scope.outputs.run_linux == 'true' }},"result":"${{ needs.test-linux.result }}"},
          {"name":"test-windows","expected":${{ needs.scope.outputs.run_windows == 'true' }},"result":"${{ needs.test-windows.result }}"},
          {"name":"app-packed-artifact","expected":${{ needs.scope.outputs.run_app_packed_artifact == 'true' }},"result":"${{ needs.app-packed-artifact.result }}"},
          {"name":"e2e","expected":${{ needs.scope.outputs.run_e2e == 'true' }},"result":"${{ needs.e2e.result }}"},
          {"name":"desktop-rust","expected":${{ needs.scope.outputs.run_rust == 'true' }},"result":"${{ needs.desktop-rust.result }}"},
          {"name":"lighthouse","expected":${{ needs.scope.outputs.run_lighthouse == 'true' }},"result":"${{ needs.lighthouse.result }}"}
        ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download execution plan
        if: needs.scope.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.scope.outputs.plan_artifact_name }}
          path: .ci
      - name: Validate execution plan
        if: needs.scope.result == 'success'
        env:
          CI_EXECUTION_PLAN_FILE: .ci/execution-plan.json
          CI_PLAN_HASH: ${{ needs.scope.outputs.plan_hash }}
        run: node scripts/ci/validate-execution-plan.mjs
      - run: node scripts/ci/assert-gate.mjs

  ui-e2e-gate:
    name: UI E2E Gate
    if: always()
    needs: [scope, ui-e2e-build, e2e-ui, resizable-panels-compat, merge-reports]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_GATE_RESULTS: >-
        [
          {"name":"scope","expected":true,"result":"${{ needs.scope.result }}"},
          {"name":"ui-e2e-build","expected":${{ needs.scope.outputs.run_worker_build == 'true' }},"result":"${{ needs.ui-e2e-build.result }}"},
          {"name":"e2e-ui","expected":${{ needs.scope.outputs.run_ui_e2e == 'true' }},"result":"${{ needs.e2e-ui.result }}"},
          {"name":"resizable-panels-compat","expected":${{ needs.scope.outputs.run_resizable_panels_compat == 'true' }},"result":"${{ needs.resizable-panels-compat.result }}"},
          {"name":"merge-reports","expected":${{ needs.scope.outputs.run_ui_e2e == 'true' }},"result":"${{ needs.merge-reports.result }}"}
        ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download execution plan
        if: needs.scope.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.scope.outputs.plan_artifact_name }}
          path: .ci
      - name: Validate execution plan
        if: needs.scope.result == 'success'
        env:
          CI_EXECUTION_PLAN_FILE: .ci/execution-plan.json
          CI_PLAN_HASH: ${{ needs.scope.outputs.plan_hash }}
        run: node scripts/ci/validate-execution-plan.mjs
      - run: node scripts/ci/assert-gate.mjs
