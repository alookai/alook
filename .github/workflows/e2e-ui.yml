name: E2E UI

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: e2e-ui-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: UI Change Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_ui_e2e: ${{ steps.scope.outputs.run_ui_e2e }}
      e2e_matrix: ${{ steps.scope.outputs.e2e_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          args=(--base "$BASE_SHA" --head "$HEAD_SHA" --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY")
          if [[ "$FORCE_FULL" == "true" ]]; then args+=(--force-full); fi
          node scripts/ci/changed-scopes.mjs "${args[@]}"
          node scripts/ci/e2e-shards.mjs --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  e2e-ui:
    name: UI Playwright E2E (${{ matrix.shard }}/${{ matrix.total }})
    needs: scope
    if: needs.scope.outputs.run_ui_e2e == 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      options: --init --ipc=host --user 1001
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.e2e_matrix) }}
    env:
      BETTER_AUTH_SECRET: ci-e2e-ui-secret
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - env:
          E2E_SPECS: ${{ toJSON(matrix.specs) }}
        run: |
          node scripts/ci/e2e-shard-artifacts.mjs write-manifest \
            --output src/web/e2e-shard-manifest/shard-manifest.json \
            --run-id "${{ github.run_id }}" \
            --attempt "${{ github.run_attempt }}" \
            --sha "${{ github.sha }}" \
            --shard "${{ matrix.shard }}" \
            --total "${{ matrix.total }}"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: printf 'BETTER_AUTH_SECRET=ci-e2e-ui-secret\nBETTER_AUTH_URL=http://localhost:3000\nDEVICE_CLIENT_IDS=e2e-test-client\nENCRYPTION_KEY=ci-e2e-encryption-key-32chars!!\nDEV_WS_DO_URL=http://localhost:3000\nNODE_ENV=development\n' > src/web/.dev.vars
      - env:
          E2E_SPECS: ${{ toJSON(matrix.specs) }}
        run: |
          mapfile -t specs < <(node -e 'for (const spec of JSON.parse(process.env.E2E_SPECS)) console.log(spec)')
          pnpm --filter @alook/web exec playwright test "${specs[@]}"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: blob-report-${{ github.run_id }}-${{ matrix.shard }}
          path: |
            src/web/blob-report/
            src/web/e2e-shard-manifest/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-artifacts-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: |
            src/web/test-results/
            src/web/e2e-service-logs/
          if-no-files-found: ignore
          retention-days: 7

  merge-reports:
    name: Merge Playwright Reports
    needs: [scope, e2e-ui]
    if: ${{ !cancelled() && needs.scope.outputs.run_ui_e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: blob-report-${{ github.run_id }}-*
          path: downloaded-blob-reports
          merge-multiple: false
      - env:
          E2E_MATRIX: ${{ needs.scope.outputs.e2e_matrix }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/ci/e2e-shard-artifacts.mjs verify-artifacts \
            --root downloaded-blob-reports \
            --output verified-blob-reports \
            --run-id "${{ github.run_id }}" \
            --attempt "${{ github.run_attempt }}" \
            --sha "${{ github.sha }}"
      - env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ github.workspace }}/playwright-report
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/merged-report.json
        run: pnpm --filter @alook/web exec playwright merge-reports --reporter html,json "${{ github.workspace }}/verified-blob-reports"
      - env:
          E2E_MATRIX: ${{ needs.scope.outputs.e2e_matrix }}
        run: node scripts/ci/e2e-shard-artifacts.mjs verify-merged --report merged-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            merged-report.json
          if-no-files-found: error
          retention-days: 14

  ui-e2e-gate:
    name: UI E2E Gate
    if: always()
    needs: [scope, e2e-ui, merge-reports]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_GATE_RESULTS: >-
        [
          {"name":"scope","expected":true,"result":"${{ needs.scope.result }}"},
          {"name":"e2e-ui","expected":${{ needs.scope.outputs.run_ui_e2e == 'true' }},"result":"${{ needs.e2e-ui.result }}"},
          {"name":"merge-reports","expected":${{ needs.scope.outputs.run_ui_e2e == 'true' }},"result":"${{ needs.merge-reports.result }}"}
        ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: node scripts/ci/assert-gate.mjs
