name = "alook-email-worker"
main = "src/index.ts"
compatibility_date = "2026-09-07"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = false
head_sampling_rate = 1
persist = true

[observability.traces]
enabled = false

[observability.issues]
enabled = true

# Must match DEV_PORTS.emailWorker in src/shared/src/constants.ts
[dev]
port = 8787
inspector_port = 9231

[[send_email]]
name = "SEND_EMAIL"

[[durable_objects.bindings]]
name = "IMAP_POLLER"
class_name = "ImapPollerDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ImapPollerDO"]
