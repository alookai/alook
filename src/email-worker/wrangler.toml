name = "alook-email-worker"
main = "src/index.ts"
compatibility_date = "2026-09-07"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.logs]
invocation_logs = true
head_sampling_rate = 0.1
destinations = ["grafana-logs"]

[observability.traces]
enabled = true
head_sampling_rate = 0.05
destinations = ["grafana-traces"]

# Must match DEV_PORTS.emailWorker in src/shared/src/constants.ts
[dev]
port = 8787
inspector_port = 9231

[[send_email]]
name = "SEND_EMAIL"

[[durable_objects.bindings]]
name = "IMAP_POLLER"
class_name = "ImapPollerDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ImapPollerDO"]
