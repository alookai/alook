name = "alook-web"
main = "custom-worker.ts"
compatibility_date = "2026-09-07"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
# Disable esbuild keep_names — otherwise __name(...) wrappers leak into
# stringified inline scripts (ThemeScript, next-themes) and throw
# "__name is not defined" at runtime in the browser.
keep_names = false

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.logs]
invocation_logs = true
head_sampling_rate = 0.1
destinations = ["grafana-logs"]

[observability.traces]
enabled = true
head_sampling_rate = 0.05
destinations = ["grafana-traces"]

# OpenNext required bindings
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "alook-web"

# OpenNext internal cache
[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "alook-next-cache"

[[d1_databases]]
binding = "NEXT_TAG_CACHE_D1"
database_id = "f15ea77a-d5e9-460e-926b-532948e3ad1b"
database_name = "alook-next-tags"

[[durable_objects.bindings]]
name = "NEXT_CACHE_DO_QUEUE"
class_name = "DOQueueHandler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DOQueueHandler"]

# App bindings
[[d1_databases]]
binding = "DB"
database_id = "1593b87c-d8a8-4cdf-b6c0-c80d94442654"
database_name = "alook-app"

[[r2_buckets]]
binding = "EMAIL_BUCKET"
bucket_name = "alook-emails"

[[r2_buckets]]
binding = "COMMUNITY_MEDIA"
bucket_name = "alook-community-media"

[[r2_buckets]]
binding = "BUG_REPORTS"
bucket_name = "alook-bug-reports"

# WS Durable Object is in a separate worker — access via Service Binding
[[services]]
binding = "WS_DO_WORKER"
service = "alook-ws-do"

[[services]]
binding = "EMAIL_WORKER"
service = "alook-email-worker"

[[services]]
binding = "BLOG_WORKER"
service = "alook-blog"

# Versioned background-task producer. The consumer is `alook-queue-worker`.
[[queues.producers]]
binding = "TASK_QUEUE"
queue = "alook-queue"

# Dev-only direct path to the `alook-queue-worker` HTTP dev endpoint — local
# Cloudflare Queues can't bridge separate `wrangler dev`/`next dev` processes
# (see plans/minimal-wake-queue-unread-notice.md), so `queue-transport.ts` uses
# this binding (with an HTTP fallback, like `WS_DO_WORKER`) instead of
# `TASK_QUEUE` when `NODE_ENV === "development"`. Unused in production.
[[services]]
binding = "QUEUE_WORKER"
service = "alook-queue-worker"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "3aaa92b4c2c74185b888977e5552e9bf"

[vars]
RUNTIME_MODEL_OPTIONS = '{"claude":["claude-opus-4-6","claude-sonnet-4-6","claude-haiku-4-5"],"codex":["gpt-5.4","gpt-5.3-codex"]}'
MIN_CLI_VERSION = "0.0.159"
BLOG_DISCOVERY_REQUIRED = "true"
