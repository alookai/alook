<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Alook — Duo folded and unfolded artwork</title>
<style>
@font-face{font-family:Caveat;src:url(caveat.woff2);font-weight:400 700;font-display:block}
@font-face{font-family:DMSans;src:url(dm-sans.woff2);font-weight:100 1000;font-display:block}
*{box-sizing:border-box}
html,body{margin:0;width:2007px;height:2853px;overflow:hidden;background:#fff8ec;color:#192625;font-family:DMSans,Arial,sans-serif}
.poster{--mm:10px;position:relative;width:2007px;height:2853px;overflow:hidden;background:linear-gradient(165deg,#fff8ec 0%,#fff0dc 30%,#ffd8a5 62%,#ff9b43 100%)}
.poster:before{content:"";position:absolute;width:2500px;height:2500px;border:3px solid #fff8ecaa;border-radius:50%;left:-600px;top:1050px;box-shadow:0 0 0 210px #fff8ec33,0 0 0 420px #fff8ec22}
.brand{position:absolute;left:132px;top:112px;display:flex;align-items:center;gap:26px;font-family:Caveat,cursive;font-size:144px;font-weight:700;letter-spacing:-5px;line-height:1}
.brand img{width:114px;height:114px}
.number{position:absolute;right:139px;top:166px;font-size:35px;font-weight:700;letter-spacing:7px;color:#715340}
h1{position:absolute;left:126px;right:110px;top:345px;margin:0;font-size:226px;font-weight:1000;line-height:1.01;letter-spacing:-9px}
.accent{color:#b94f13}
.subtitle{position:absolute;left:136px;top:1060px;margin:0;color:#715340;font-size:65px;line-height:1.3;letter-spacing:-1px}
.device{position:absolute;display:flex;align-items:center;justify-content:center;height:calc(117.8 * var(--mm));background:linear-gradient(105deg,#ded7ce,#7f7a70 20%,#f2eee5 45%,#403f3c 65%,#b1aca3);border:2px solid #4d4c49;box-shadow:0 2px 0 3px #fff8ec,0 48px 85px #7a482c55}
.screen{position:relative;flex-shrink:0;overflow:hidden;background:#11110f}
.screen img{display:block;width:100%;height:100%;object-fit:contain}
.unfolded{left:150px;top:1300px;width:calc(164.6 * var(--mm));border-radius:83px;transform:perspective(3500px) rotateY(-7deg) rotateZ(-5deg);z-index:1}
.unfolded .screen{width:calc(100% - 24px);aspect-ratio:2670 / 1878;border-radius:68px}
.crease{position:absolute;left:calc(50% - 26px);top:0;bottom:0;width:52px;background:linear-gradient(90deg,transparent,#00000032 38%,#ffffff16 55%,transparent);pointer-events:none}
.hinge-top,.hinge-bottom{position:absolute;width:24px;height:18px;left:calc(50% - 12px);background:linear-gradient(90deg,#484943,#ddd6cb,#545650);z-index:2}
.hinge-top{top:-6px;border-radius:0 0 5px 5px}.hinge-bottom{bottom:-6px;border-radius:5px 5px 0 0}
.folded{left:1005px;top:1545px;width:calc(84.1 * var(--mm));border-radius:86px;transform:perspective(2500px) rotateY(-10deg) rotateZ(7deg);z-index:3}
.folded .screen{height:calc(100% - 24px);aspect-ratio:1398 / 2034;border-radius:70px}
.folded:before{content:"";position:absolute;right:-14px;top:80px;bottom:78px;width:17px;background:linear-gradient(90deg,#d5d0c5,#56564f,#c3bdae);border-radius:0 10px 10px 0;z-index:-1}
.folded:after{content:"";position:absolute;right:-20px;top:250px;width:8px;height:127px;background:#69685f;border:1px solid #d8d2c6;border-radius:0 5px 5px 0}
.face{position:absolute;object-fit:contain;filter:drop-shadow(0 12px 0 #fff8ec) drop-shadow(0 22px 25px #7a482c28);z-index:5}
.purple{left:50px;top:1150px;width:180px;transform:rotate(-17deg)}
.teal{left:1750px;top:1010px;width:180px;transform:rotate(12deg)}
.orange{left:110px;top:2610px;width:210px;transform:rotate(-11deg)}
.blue{left:720px;top:2640px;width:155px;transform:rotate(14deg)}
.red{left:1840px;top:2690px;width:135px;transform:rotate(16deg)}
</style>
<main class="poster">
  <div class="brand"><img src="alook.svg" alt="">Alook</div>
  <div class="number">06 / 06</div>
  <h1>KEEP YOUR<br>EXISTING<br><span class="accent">SETUP.</span></h1>
  <p class="subtitle">Connect the agent you already use.</p>
  <div class="device unfolded">
    <div class="screen"><img src="duo-open-demo.jpg" alt="The public Alook conversation in a wide unfolded layout"><div class="crease"></div></div>
    <div class="hinge-top"></div><div class="hinge-bottom"></div>
  </div>
  <div class="device folded"><div class="screen"><img src="duo-closed-demo.jpg" alt="The same public Alook conversation in a folded mobile layout"></div></div>
  <img class="face purple" src="face-purple.svg" alt="">
  <img class="face teal" src="face-teal.svg" alt="">
  <img class="face orange" src="face-orange.svg" alt="">
  <img class="face blue" src="face-blue.svg" alt="">
  <img class="face red" src="face-red.svg" alt="">
</main>
</html>
