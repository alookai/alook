<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 920" role="img" aria-labelledby="title desc">
<title id="title">Where Board messages travel</title><desc id="desc">Slack and Linear sync in both directions with Board. GitHub activity goes to Board by default; replies back to GitHub require extra setup. Slack channel members see synced messages.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8z" fill="#356f95"/></marker></defs>
<rect width="800" height="920" rx="24" fill="#f4f9e9"/><g font-family="Arial,sans-serif" fill="#1b271f"><text x="64" y="88" font-size="42" font-weight="700">Where messages travel</text><rect x="64" y="160" width="200" height="476" rx="20" fill="#1b271f"/><text x="164" y="390" text-anchor="middle" font-size="37" font-weight="700" fill="#fff">Vercel</text><text x="164" y="438" text-anchor="middle" font-size="37" font-weight="700" fill="#fff">Board</text>
<rect x="500" y="160" width="232" height="112" rx="18" fill="#ddedb7"/><text x="616" y="229" text-anchor="middle" font-size="38" font-weight="700">Slack</text><rect x="500" y="342" width="232" height="112" rx="18" fill="#ddedb7"/><text x="616" y="411" text-anchor="middle" font-size="38" font-weight="700">Linear</text><rect x="500" y="524" width="232" height="112" rx="18" fill="#ddedb7"/><text x="616" y="593" text-anchor="middle" font-size="38" font-weight="700">GitHub</text>
<g stroke="#356f95" stroke-width="6" fill="none"><path d="M286 216 H477" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M286 398 H477" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M477 580 H286" marker-end="url(#arrow)"/></g><text x="380" y="188" font-size="30" text-anchor="middle" fill="#294f6a">two-way</text><text x="380" y="370" font-size="30" text-anchor="middle" fill="#294f6a">two-way</text><text x="380" y="552" font-size="30" text-anchor="middle" fill="#294f6a">default</text><text x="64" y="726" font-size="30">GitHub replies need extra setup.</text><text x="64" y="790" font-size="30">Slack channel members see</text><text x="64" y="832" font-size="30">messages synced there.</text></g></svg>
