<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 920" role="img" aria-labelledby="title desc"><title id="title">A task handoff in Board</title><desc id="desc">A review task waits until its prerequisite is complete. A claim has a lease. After expiry another worker may claim; a running process may continue.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8z" fill="#356f95"/></marker></defs><rect width="800" height="920" rx="24" fill="#f4f9e9"/><g font-family="Arial,sans-serif" fill="#1b271f"><text x="64" y="88" font-size="42" font-weight="700">A task handoff</text><rect x="64" y="135" width="672" height="166" rx="20" fill="#ddedb7"/><text x="96" y="197" font-size="35">TASK A · FIX</text><text x="96" y="260" font-size="44" font-weight="700">Completed</text><path d="M400 321 V410" stroke="#356f95" stroke-width="7" marker-end="url(#arr)"/><text x="435" y="376" font-size="33" fill="#294f6a">unblocks</text><rect x="64" y="430" width="672" height="166" rx="20" fill="#dcebf2"/><text x="96" y="492" font-size="35">TASK B · REVIEW</text><text x="96" y="555" font-size="44" font-weight="700">Ready to claim</text><rect x="64" y="645" width="672" height="200" rx="20" fill="#1b271f"/><text x="96" y="703" font-size="34" font-weight="700" fill="#c9f06b">A claim has a lease.</text><text x="96" y="760" font-size="30" fill="#fff">After expiry, another worker</text><text x="96" y="802" font-size="30" fill="#fff">can claim. A process may continue.</text></g></svg>
