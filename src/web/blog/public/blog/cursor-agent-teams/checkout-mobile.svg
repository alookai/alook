<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1200" role="img" aria-labelledby="t d"><title id="t">Subagent file boundaries</title><desc id="d">Shared checkout by default; isolated branches when requested.</desc><rect width="720" height="1200" fill="#F4F9E9"/><g font-family="Arial,sans-serif" fill="#1B271F"><text x="80" y="110" font-size="29" font-weight="700">Where subagents edit</text><text x="80" y="148" font-size="26" fill="#47633B">Separate context ≠ separate files.</text><rect x="75" y="190" width="570" height="397" rx="22" fill="#fff" stroke="#CBD9BE"/><rect x="75" y="620" width="570" height="410" rx="22" fill="#fff" stroke="#CBD9BE"/><text x="104" y="235" font-size="26" font-weight="700">Shared checkout · default</text><text x="104" y="665" font-size="26" font-weight="700">Isolated · on request</text><g fill="#DDEDB7" stroke="#6B8761" stroke-width="2"><rect x="265" y="260" width="190" height="50" rx="12"/><rect x="135" y="358" width="180" height="50" rx="12"/><rect x="405" y="358" width="180" height="50" rx="12"/><rect x="265" y="685" width="190" height="50" rx="12"/><rect x="135" y="783" width="180" height="50" rx="12"/><rect x="405" y="783" width="180" height="50" rx="12"/></g><g text-anchor="middle" font-size="26" font-weight="700"><text x="360" y="291">Parent agent</text><text x="225" y="390">Subagent A</text><text x="495" y="390">Subagent B</text><text x="360" y="716">Parent agent</text><text x="225" y="815">Subagent A</text><text x="495" y="815">Subagent B</text></g><g stroke="#356F95" stroke-width="3" fill="none"><path d="M320 310 L225 358 M400 310 L495 358 M225 408 L315 454 M495 408 L405 454 M320 735 L225 783 M400 735 L495 783 M225 833 V880 M495 833 V880"/></g><rect x="255" y="454" width="210" height="54" rx="12" fill="#F6EACE" stroke="#BB9655"/><rect x="143" y="880" width="165" height="54" rx="12" fill="#E2EEF4" stroke="#356F95"/><rect x="412" y="880" width="165" height="54" rx="12" fill="#E2EEF4" stroke="#356F95"/><g font-size="26" font-weight="700" text-anchor="middle"><text x="360" y="487">One checkout</text><text x="225" y="913">Branch A</text><text x="495" y="913">Branch B</text></g><g font-size="26" fill="#47633B"><text x="104" y="552">Edits to the same file may collide.</text><text x="104" y="984">Parent integrates changes.</text></g></g></svg>
