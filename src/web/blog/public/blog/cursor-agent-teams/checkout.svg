<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Subagents: shared checkout and isolated environments</title><desc id="desc">On the left two subagents use one checkout; on the right they each use their own branch and send results to their parent.</desc>
<rect width="1200" height="600" rx="28" fill="#F4F9E9"/><g transform="translate(132 66) scale(0.78)"><g font-family="Arial, sans-serif" fill="#1B271F"><text x="64" y="70" font-size="30" font-weight="700">Same parent, different file boundaries</text><text x="64" y="109" font-size="19" fill="#47633B">Separate context alone does not create separate files.</text>
<rect x="48" y="145" width="532" height="405" rx="24" fill="#fff" stroke="#CBD9BE"/><rect x="620" y="145" width="532" height="405" rx="24" fill="#fff" stroke="#CBD9BE"/>
<text x="78" y="187" font-size="22" font-weight="700">Shared checkout · default</text><text x="650" y="187" font-size="22" font-weight="700">Isolated environments · on request</text>
<g fill="#DDEDB7" stroke="#6B8761" stroke-width="2"><rect x="211" y="210" width="190" height="48" rx="12"/><rect x="781" y="210" width="190" height="48" rx="12"/><rect x="105" y="315" width="155" height="50" rx="12"/><rect x="346" y="315" width="155" height="50" rx="12"/><rect x="681" y="315" width="155" height="50" rx="12"/><rect x="914" y="315" width="155" height="50" rx="12"/></g>
<g font-size="17" font-weight="700" text-anchor="middle"><text x="306" y="241">Parent agent</text><text x="876" y="241">Parent agent</text><text x="182" y="346">Subagent A</text><text x="423" y="346">Subagent B</text><text x="758" y="346">Subagent A</text><text x="991" y="346">Subagent B</text></g>
<g stroke="#356F95" stroke-width="3" fill="none"><path d="M265 258 L182 315 M347 258 L423 315 M835 258 L758 315 M917 258 L991 315"/><path d="M182 365 L258 425 M423 365 L354 425 M758 365 L758 425 M991 365 L991 425"/></g>
<rect x="209" y="425" width="194" height="60" rx="12" fill="#F6EACE" stroke="#BB9655"/><rect x="678" y="425" width="160" height="60" rx="12" fill="#E2EEF4" stroke="#356F95"/><rect x="911" y="425" width="160" height="60" rx="12" fill="#E2EEF4" stroke="#356F95"/><g font-size="17" font-weight="700" text-anchor="middle"><text x="306" y="460">One checkout</text><text x="758" y="460">Branch A</text><text x="991" y="460">Branch B</text></g>
<g font-size="16" fill="#47633B"><text x="78" y="520">Concurrent edits to the same file may collide.</text><text x="650" y="520">Parent integrates the separate changes.</text></g></g></g></svg>
