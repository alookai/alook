<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1200" role="img" aria-labelledby="t d"><title id="t">Project context and personal stores</title><desc id="d">Two members' agents share project context and keep separate personal stores.</desc><rect width="720" height="1200" fill="#F4F9E9"/><g font-family="Arial,sans-serif" fill="#1B271F"><text x="80" y="108" font-size="28" font-weight="700">One project, personal stores</text><text x="80" y="145" font-size="26" fill="#47633B">Project knowledge is shared with agents.</text><rect x="100" y="190" width="520" height="116" rx="22" fill="#DDEDB7" stroke="#6B8761" stroke-width="2"/><text x="360" y="238" text-anchor="middle" font-size="24" font-weight="700">Project context</text><text x="360" y="273" text-anchor="middle" font-size="26" fill="#47633B">Shared notes and project knowledge</text><rect x="82" y="357" width="556" height="274" rx="22" fill="#fff" stroke="#CBD9BE"/><rect x="82" y="664" width="556" height="274" rx="22" fill="#fff" stroke="#CBD9BE"/><text x="112" y="398" font-size="26" font-weight="700">Member A</text><text x="112" y="705" font-size="26" font-weight="700">Member B</text><path d="M300 306 V340 H223 V428 M120 306 H72 V769 H116" stroke="#356F95" stroke-width="3" fill="none"/><g fill="#E2EEF4" stroke="#356F95" stroke-width="2"><rect x="116" y="428" width="214" height="68" rx="14"/><rect x="390" y="428" width="214" height="68" rx="14"/><rect x="116" y="735" width="214" height="68" rx="14"/><rect x="390" y="735" width="214" height="68" rx="14"/></g><g text-anchor="middle" font-size="26" font-weight="700"><text x="223" y="469">A’s agents</text><text x="497" y="469">A’s store</text><text x="223" y="776">B’s agents</text><text x="497" y="776">B’s store</text></g><g stroke="#356F95" stroke-width="3"><path d="M330 462 H390 M330 769 H390"/></g><g font-size="26" fill="#47633B"><text x="114" y="548">A’s preferences stay with A’s agents.</text><text x="114" y="855">B’s preferences stay with B’s agents.</text><text x="82" y="1025">A stale note can mislead the agents that read it.</text></g></g></svg>
