<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Project context and personal stores</title><desc id="desc">Two members' agents use the same project context, while their personal stores stay with their respective agents.</desc>
<rect width="1200" height="600" rx="28" fill="#F4F9E9"/><g transform="translate(132 66) scale(0.78)"><g font-family="Arial, sans-serif" fill="#1B271F"><text x="64" y="70" font-size="30" font-weight="700">A common project, separate personal stores</text><text x="64" y="109" font-size="19" fill="#47633B">Project context travels across the team. Personal preferences stay with their owner’s agents.</text>
<rect x="50" y="150" width="315" height="400" rx="24" fill="#fff" stroke="#CBD9BE"/><rect x="835" y="150" width="315" height="400" rx="24" fill="#fff" stroke="#CBD9BE"/><rect x="424" y="258" width="352" height="123" rx="24" fill="#DDEDB7" stroke="#6B8761" stroke-width="2"/>
<text x="78" y="194" font-size="21" font-weight="700">Member A</text><text x="863" y="194" font-size="21" font-weight="700">Member B</text>
<g fill="#E2EEF4" stroke="#356F95" stroke-width="2"><rect x="101" y="235" width="213" height="62" rx="14"/><rect x="886" y="235" width="213" height="62" rx="14"/><rect x="101" y="413" width="213" height="72" rx="14"/><rect x="886" y="413" width="213" height="72" rx="14"/></g>
<g font-size="18" font-weight="700" text-anchor="middle"><text x="207" y="274">A’s agents</text><text x="992" y="274">B’s agents</text><text x="600" y="310" font-size="23">Project context</text><text x="207" y="445">A’s personal store</text><text x="992" y="445">B’s personal store</text></g><g font-size="16" fill="#47633B" text-anchor="middle"><text x="600" y="341">Shared notes and project knowledge</text><text x="207" y="470">Preferences and skills</text><text x="992" y="470">Preferences and skills</text></g>
<g stroke="#356F95" stroke-width="3" fill="none"><path d="M314 266 C365 266 370 305 424 305"/><path d="M886 266 C835 266 830 305 776 305"/><path d="M207 297 L207 413"/><path d="M992 297 L992 413"/></g>
<text x="600" y="504" text-anchor="middle" font-size="17" fill="#47633B">A stale project requirement may affect every agent that reads it.</text></g></g></svg>
