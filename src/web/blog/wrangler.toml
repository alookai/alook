name = "alook-blog"
main = "custom-worker.ts"
compatibility_date = "2026-09-07"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
keep_names = false
workers_dev = false
preview_urls = true

[observability.logs]
enabled = false
invocation_logs = false
head_sampling_rate = 0

[observability.traces]
enabled = false
head_sampling_rate = 0

[observability.issues]
enabled = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"
run_worker_first = [
  "/*",
  "!/_next/static/*",
  "!/blog-static/_next/static/*",
  "!/blog/_generated/*",
  "!/blog/*.webp",
  "!/blog/*.png",
  "!/blog/*.jpg",
  "!/blog/*.jpeg",
  "!/blog/*.svg",
  "!/blog/*.md",
  "!/usecases/*.webp",
  "!/usecases/*.png",
  "!/usecases/*.jpg",
  "!/usecases/*.jpeg",
  "!/usecases/*.svg",
  "!/fonts/*",
  "!/alook.svg",
  "!/apple-touch-icon.png",
  "!/icon-192.png",
  "!/favicon.ico",
  "!/manifest.json",
]

[[routes]]
pattern = "alook.ai/blog*"
zone_name = "alook.ai"

[[routes]]
pattern = "alook.ai/guides*"
zone_name = "alook.ai"

[[routes]]
pattern = "alook.ai/tutorials*"
zone_name = "alook.ai"

[[routes]]
pattern = "alook.ai/usecases*"
zone_name = "alook.ai"

[[routes]]
pattern = "alook.ai/og/blog*"
zone_name = "alook.ai"
