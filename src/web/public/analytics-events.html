window.sendProductEvent = function ({ event, params }) {

    const item = Array.isArray(params?.items) && params.items.length === 1 ? params.items[0] : null;
    if (!item || !['studio', 'house'].includes(item.item_id) || item.quantity !== 1 || !Number.isFinite(params.value) || params.value < 0 || item.price !== params.value || !['pricing_page', 'billing_sheet'].includes(params.entry_point) || typeof params.currency !== 'string') return;

    if (!Intl.supportedValuesOf('currency').includes(currency)) return;

</script>
