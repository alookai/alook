[package]
name = "tauri-plugin-touch-setup"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-touch-setup"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "=2.12.1", default-features = false }

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "=2.12.1", features = ["wry"], default-features = false }
