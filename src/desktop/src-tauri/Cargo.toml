[package]
name = "alook-desktop"
version = "0.1.37"
edition = "2021"
description = "Alook — Share your agents with people you trust"

[lib]
name = "alook_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.11.2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-store = "2"
base64 = "0.22"
getrandom = "0.3"
png = "0.18"
sha2 = "0.10"
subtle = "2"
unicode-normalization = "0.1"
url = "2"

[target."cfg(any(target_os = \"android\", target_os = \"ios\"))".dependencies]
tauri-plugin-mobile-share-image = { path = "plugins/mobile-share-image" }
tauri-plugin-mobile-push = { path = "plugins/mobile-push" }

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tokio = { version = "1", features = ["macros"] }
command-group = "5.0.1"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target."cfg(any(target_os = \"macos\", target_os = \"ios\"))".dependencies]
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", features = ["NSDictionary", "NSError", "NSGeometry", "NSObject", "NSString", "NSURL", "NSURLError", "NSURLRequest"] }

[target."cfg(target_os = \"macos\")".dependencies]
block2 = "=0.6.2"
objc2-app-kit = { version = "=0.3.2", features = ["NSView", "NSWindow", "NSColor"] }
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["std", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter", "block2"] }
objc2-web-kit = { version = "=0.3.2", features = ["WKWebView"], default-features = false }

[target."cfg(windows)".dependencies]
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = ["Data_Xml_Dom", "UI_Notifications"] }

[target."cfg(target_os = \"linux\")".dependencies]
notify-rust = "=4.17.0"
webkit2gtk = { version = "=2.0.2", features = ["v2_6"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
