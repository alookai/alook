coverage:
  status:
    project:
      shared:
        informational: true
        target: auto
        paths:
          - src/shared/**
      email-worker:
        informational: true
        target: auto
        paths:
          - src/email-worker/**
      ws-do:
        informational: true
        target: auto
        paths:
          - src/ws-do/**
      web:
        informational: true
        target: auto
        paths:
          - src/web/**
    patch:
      default:
        informational: true
        target: auto

ignore:
  - "src/web/src/components/home/**"
  - "src/web/scripts/**"
  - "src/web/readme-capture/**"
  # Next config is loaded by the Next runtime, not vitest — redirects live in
  # `src/web/src/lib/blog/redirects.ts` (unit-tested) and are wired here only.
  - "src/web/next.config.ts"
  - "src/web/blog/next.config.ts"
  # Playwright browser E2E — driven by `playwright test`, not vitest, so these
  # files never appear in coverage and shouldn't count against patch %.
  - "src/web/src/test/e2e-ui/**"
  # Test-data generators are exercised by Playwright consumers; they are not
  # shipped application code and should not count toward production coverage.
  - "src/web/src/test/fixtures/**"

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true
